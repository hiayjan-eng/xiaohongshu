<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>收藏数据深度检测</title><link rel="stylesheet" href="./sidepanel.css" /></head>
<body><main class="panel-shell">
  <header class="panel-header"><div><p class="eyebrow">0.5.0-m0-cdp-spike</p><h1>收藏数据深度检测</h1></div><span id="statusBadge" class="status-badge">等待授权</span></header>
  <section class="identity-card"><p id="statusMessage">深度检测会临时使用浏览器调试接口读取当前小红书标签页的网络数据，只在本机内存分析；不会上传 Cookie、token、正文或账号数据，结束后自动断开。</p><button id="startCdp" class="primary-button" type="button">深度检测收藏数据</button><button id="stopCdp" class="text-button" type="button" disabled>结束检测</button></section>
  <section class="progress-card"><div class="progress-heading"><span id="phase">等待授权</span><span id="updatedAt">—</span></div><div class="progress-track"><span id="progressFill"></span></div><p id="summary">等待用户授权浏览器调试接口。</p></section>
  <section class="stats-grid"><div><span>收藏候选</span><strong id="favoriteCount">0</strong></div><div><span>专辑候选</span><strong id="albumCount">0</strong></div><div><span>专辑内容</span><strong id="albumContentCount">0</strong></div><div><span>推导关系</span><strong id="derivedCount">0</strong></div><div><span>过滤安全/统计</span><strong id="filteredCount">0</strong></div><div><span>debugger</span><strong id="attached">未连接</strong></div></section>
  <section class="review-card"><h2>脱敏业务候选</h2><p class="muted" id="dataSources">数据来源：—</p><p class="muted" id="signature">业务接口动态签名：未发现</p><pre id="candidateOutput">[]</pre></section>
</main><script src="./build-profile.js"></script><script src="./sidepanel.js"></script></body></html>
